<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skyly</title>
  <link rel="icon" type="image/webp" href="weather-icon.webp">
  <link rel="stylesheet" href="src/index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
  <div class="container">

  <header>
    <h1>Skyly</h1>
    <h3>Know Your Sky</h3>

    <form>
      <input type="search" placeholder="Eg: Nairobi" class="search-form-input" required />
      <input type="submit" value="Search" class="search-button"/>
    </form>
  </header>

  <main>
    <div>
      <h2>Kampala</h2>

      <p>Tuesday 14:49, scattered clouds <br>
        Humidity: 65% Wind: 10 km/h</p>
    </div>
    <div>
      <h1>🌤️12&deg;C</h1>
    </div>
  </main>

  <footer>
    <p>Created by <a href="https://github.com/AngellaMirembe">Angella</a> is <a
        href="https://github.com/AngellaMirembe/Skyly">open-sourced on GitHub</a> and <a
        href="https://skyly96.netlify.app/">hosted on Netlify</a></p>
  </footer>
  </div>
</body>

</html>
